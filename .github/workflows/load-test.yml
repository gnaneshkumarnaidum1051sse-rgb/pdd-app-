name: "🚀 API Load Testing — Baseline (100 VUs × 1 min)"

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - "load-tests/**"
      - ".github/workflows/load-test.yml"
  pull_request:
    paths:
      - "backend/**"
      - "load-tests/**"
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend URL to target (leave blank to use built-in mock server)"
        required: false
        default: ""
      use_mock:
        description: "Force use of built-in mock server (ignores backend_url)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# ─────────────────────────────────────────────────────────────────────────────
# Permissions
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: read
  actions: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job: load-test
  # ───────────────────────────────────────────────────────────────────────────
  load-test:
    name: "Baseline Load Test — 100 VUs × 1 min"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ─────────────────────────────────────────────────
      - name: "⚙️  Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── 3. Install k6 ────────────────────────────────────────────────────
      - name: "📦 Install k6"
        uses: grafana/setup-k6-action@v1

      # ── 4. Install Node dependencies ──────────────────────────────────────
      - name: "📦 Install load-tests Node dependencies"
        run: |
          cd load-tests
          npm install --prefer-offline 2>/dev/null || npm install

      # ── 5. Determine backend target & start mock if needed ────────────────
      - name: "🔧 Resolve backend target & start mock server"
        id: resolve_target
        run: |
          FORCE_MOCK="${{ github.event.inputs.use_mock }}"
          MANUAL_URL="${{ github.event.inputs.backend_url }}"
          SECRET_URL="${{ secrets.BACKEND_URL }}"
          DEFAULT_URL="https://pdd-app.onrender.com"

          # Decision: use mock server?
          USE_MOCK=false
          if [ "$FORCE_MOCK" = "true" ]; then
            USE_MOCK=true
          elif [ -z "$MANUAL_URL" ] && [ -z "$SECRET_URL" ]; then
            USE_MOCK=true
          fi

          if [ "$USE_MOCK" = "true" ]; then
            echo "🚀 Starting built-in mock backend on port 3001..."
            node load-tests/mock-backend.js &
            MOCK_PID=$!
            echo "MOCK_PID=$MOCK_PID" >> $GITHUB_ENV

            # Wait for mock server to be ready (up to 15s)
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:3001/api/health > /dev/null 2>&1; then
                echo "✅ Mock server is ready (attempt $i)"
                break
              fi
              echo "⏳ Waiting for mock server... ($i/15)"
              sleep 1
            done

            BACKEND_URL="http://127.0.0.1:3001"
            echo "TARGET_MODE=mock" >> $GITHUB_ENV
          else
            BACKEND_URL="${MANUAL_URL:-${SECRET_URL:-$DEFAULT_URL}}"
            echo "TARGET_MODE=production" >> $GITHUB_ENV

            # Verify production endpoint with warm-up (3 retries)
            echo "🌐 Target: $BACKEND_URL/api/health"
            for attempt in 1 2 3; do
              STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 20 "$BACKEND_URL/api/health" || echo "000")
              echo "  Attempt $attempt: HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "✅ Production backend is healthy"
                break
              fi
              if [ $attempt -lt 3 ]; then
                echo "⏳ Retrying in 10s (cold start)..."
                sleep 10
              fi
            done
          fi

          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
          echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "📌 BACKEND_URL set to: $BACKEND_URL"

      # ── 6. Show test configuration ────────────────────────────────────────
      - name: "📋 Load test configuration"
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║         BrainBattle API — Baseline / Load Test               ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  Virtual Users   : 100                                        ║"
          echo "║  Duration        : 1 minute (60 seconds)                     ║"
          echo "║  Target          : $BACKEND_URL"
          echo "║  Mode            : $TARGET_MODE"
          echo "║  Thresholds:                                                  ║"
          echo "║    • http_req_failed  < 5%                                    ║"
          echo "║    • http_req_duration p(95) < 1500ms                         ║"
          echo "║    • check_pass_rate >= 90%                                   ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

      # ── 7. Run k6 load test ───────────────────────────────────────────────
      - name: "⚡ Run k6 — 100 VUs × 1 minute"
        id: k6_run
        run: |
          mkdir -p load-tests
          k6 run \
            --summary-export=load-tests/summary.json \
            --out json=load-tests/k6-raw.json \
            -e BACKEND_URL="$BACKEND_URL" \
            load-tests/k6-load-test.js
        # continue-on-error so the parser still runs even if thresholds breach
        continue-on-error: true
        env:
          BACKEND_URL: ${{ env.BACKEND_URL }}

      # ── 8. Stop mock server (if started) ─────────────────────────────────
      - name: "🛑 Stop mock server"
        if: always() && env.MOCK_PID != ''
        run: |
          if [ -n "$MOCK_PID" ]; then
            kill "$MOCK_PID" 2>/dev/null || true
            echo "✅ Mock server (PID $MOCK_PID) stopped"
          fi

      # ── 9. Parse results and write to Step Summary ────────────────────────
      - name: "📊 Parse k6 summary → Step Summary"
        run: |
          if [ -f "load-tests/summary.json" ]; then
            node load-tests/parseK6Summary.js load-tests/summary.json
          else
            echo "⚠️ summary.json not found — generating fallback report"
            node load-tests/parseK6Summary.js
          fi

      # ── 10. Publish header to Step Summary ───────────────────────────────
      - name: "📝 Publish test configuration to Step Summary"
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'SUMMARY_EOF'

          ---

          ## ⚙️ Test Configuration

          | Setting | Value |
          |---|---|
          | **Virtual Users** | `100` |
          | **Duration** | `1 minute` |
          | **Thresholds** | `http_req_failed < 5%` · `p(95) < 1500ms` · `checks ≥ 90%` |
          | **k6 Script** | `load-tests/k6-load-test.js` |

          ### 📖 What These Numbers Mean

          | Metric | Example | Meaning |
          |---|---|---|
          | **RPS** | `120 req/sec` | Your API handles ~120 requests per second |
          | **Average** | `250ms` | Typical request completes in 250 ms |
          | **Min** | `50ms` | Fastest individual response |
          | **Max** | `1500ms` | Slowest individual response |
          | **p95** | `800ms` | 95% of all requests are faster than 800ms |

          SUMMARY_EOF

      # ── 11. Upload raw artifacts ──────────────────────────────────────────
      - name: "📁 Upload load-test artifacts"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "load-test-results-${{ github.run_number }}"
          path: |
            load-tests/summary.json
            load-tests/k6-raw.json
          if-no-files-found: ignore
          retention-days: 30

      # ── 12. Enforce threshold gate ────────────────────────────────────────
      - name: "🚦 Enforce threshold gate"
        if: steps.k6_run.outcome == 'failure'
        run: |
          echo ""
          echo "❌ k6 thresholds were breached."
          echo "   • Ensure the backend responds quickly to 100 concurrent users."
          echo "   • Review the Step Summary above for detailed metrics."
          echo ""
          # Only fail the CI if NOT running against the mock (mock should always pass)
          if [ "$TARGET_MODE" = "production" ]; then
            exit 1
          else
            echo "ℹ️  Running against mock — treating as informational only."
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Job: generate-excel-report (runs load-test.js for local Excel output)
  # ───────────────────────────────────────────────────────────────────────────
  generate-excel-report:
    name: "📊 Generate Excel Load Test Report"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: load-test
    if: always()

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "⚙️  Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "📦 Install load-tests Node dependencies"
        run: |
          cd load-tests
          npm install --prefer-offline 2>/dev/null || npm install

      - name: "📊 Run Node.js load test engine (generates Excel report)"
        run: node load-tests/load-test.js
        timeout-minutes: 4

      - name: "📁 Upload Excel report"
        uses: actions/upload-artifact@v4
        with:
          name: "load-test-excel-${{ github.run_number }}"
          path: load-tests/load-test-summary.xlsx
          if-no-files-found: ignore
          retention-days: 30

      - name: "📝 Excel report summary"
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'

          ## 📊 Excel Report

          The BrainBattle Load Test Excel report has been generated and uploaded as a build artifact:

          - **Artifact**: `load-test-excel-${{ github.run_number }}`
          - **Sheets**: Summary · Request Details · VU Analysis · Performance Metrics
          - **Virtual Users**: 100
          - **Requests logged**: Up to 500 detailed rows
          - **VU breakdown**: All 100 VUs tabulated

          EOF
